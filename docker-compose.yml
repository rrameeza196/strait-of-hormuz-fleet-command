# Root stack: MongoDB + API/simulator + static SPA (nginx).
# First boot runs `seed` once when the DB is empty (see server/seed.js).

services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  seed:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: "no"
    environment:
      MONGO_URI: mongodb://mongodb:27017/coderush_fleet
    depends_on:
      mongodb:
        condition: service_healthy
    command: ["node", "seed.js"]

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5050:5050"
    environment:
      PORT: "5050"
      MONGO_URI: mongodb://mongodb:27017/coderush_fleet
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    depends_on:
      mongodb:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-http://localhost:5050}
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  mongodb_data:
